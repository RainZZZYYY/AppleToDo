name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Lint
        run: |
          brew install swiftlint swiftformat
          swiftlint --strict
          swiftformat --lint .

      - name: Test
        run: swift test
